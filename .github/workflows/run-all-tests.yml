# Generate the complete workspace before the single frozen dependency install.

name: 700+ Unit Tests

on:
  push:
    branches: [ "main", "latest" ]
  pull_request:
    branches: [ "main", "latest" ]
  workflow_dispatch:
    branches: [ "main", "latest" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use the repository Node.js version
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
      - name: Use Yarn 1.22.22
        run: npm install --global yarn@1.22.22
      - name: Test pipeline boundaries
        run: yarn test:pipeline
      - name: Generate workspace metadata
        run: yarn generate
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run linting
        run: yarn lint
      - name: Build development packages
        run: yarn build:dev
      - name: Build project
        run: yarn build
      - name: Run all tests
        run: yarn test
      - name: Build the local demo
        run: yarn build-demo
